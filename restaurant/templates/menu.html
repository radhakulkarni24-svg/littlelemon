{% extends 'base.html' %}

{% block title %}Menu{% endblock %}

{% block content %}
<h2>Our Menu</h2>
{% if menu %}
<ul>
    {% for item in menu %}
    <li>
        <a href="{% url 'menu_item' pk=item.pk %}">{{ item.name }}</a> - ${{ item.price }}
    </li>
    {% endfor %}
</ul>
{% else %}
<p>No menu items available yet.</p>
{% endif %}
{% endblock %}
